name: Release & Multi-Platform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without leading v, e.g. 0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.vars.outputs.version }}
      base_name: ${{ steps.vars.outputs.base_name }}
      windows_installer: ${{ steps.vars.outputs.windows_installer }}
      macos_dmg: ${{ steps.vars.outputs.macos_dmg }}
      macos_zip: ${{ steps.vars.outputs.macos_zip }}
      linux_appimage: ${{ steps.vars.outputs.linux_appimage }}
      linux_tar: ${{ steps.vars.outputs.linux_tar }}
      linux_deb: ${{ steps.vars.outputs.linux_deb }}
      linux_rpm: ${{ steps.vars.outputs.linux_rpm }}
    steps:
      - name: Compute Release Variables
        id: vars
        run: |
          # Derive VERSION from git tag (or dispatch input), stripping any leading 'v'
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RAW_VER="${GITHUB_REF_NAME}"
          else
            RAW_VER="${GITHUB_REF_NAME:-v0.1.0}"
          fi
          VERSION="${RAW_VER#v}"
          echo "Computed release version: ${VERSION}"

          # Single source of truth: lowercase base name conforming to lumark_<version>
          BASE_NAME="lumark_${VERSION}"

          # Target asset names deriving from BASE_NAME
          WIN_INSTALLER="${BASE_NAME}_windows_amd64_setup.exe"
          MAC_DMG="${BASE_NAME}_macos_universal.dmg"
          MAC_ZIP="${BASE_NAME}_macos_universal.zip"
          LINUX_APPIMAGE="${BASE_NAME}_linux_amd64.AppImage"
          LINUX_TAR="${BASE_NAME}_linux_amd64.tar.gz"
          LINUX_DEB="${BASE_NAME}_linux_amd64.deb"
          LINUX_RPM="${BASE_NAME}_linux_amd64.rpm"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_name=${BASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "windows_installer=${WIN_INSTALLER}" >> "$GITHUB_OUTPUT"
          echo "macos_dmg=${MAC_DMG}" >> "$GITHUB_OUTPUT"
          echo "macos_zip=${MAC_ZIP}" >> "$GITHUB_OUTPUT"
          echo "linux_appimage=${LINUX_APPIMAGE}" >> "$GITHUB_OUTPUT"
          echo "linux_tar=${LINUX_TAR}" >> "$GITHUB_OUTPUT"
          echo "linux_deb=${LINUX_DEB}" >> "$GITHUB_OUTPUT"
          echo "linux_rpm=${LINUX_RPM}" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux Packages (Debian, AppImage, RPM, Tarball)
    needs: [prepare]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config desktop-file-utils

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

      - name: Install appimagetool
        run: |
          curl -sSL -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          cd /tmp && ./appimagetool --appimage-extract
          sudo rm -rf /usr/local/lib/appimagetool
          sudo mv /tmp/squashfs-root /usr/local/lib/appimagetool
          sudo chmod -R 755 /usr/local/lib/appimagetool
          sudo ln -sf /usr/local/lib/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version

      - name: Build Wails App
        run: wails3 build

      - name: Stage Linux Binaries
        run: |
          mkdir -p bin build/bin
          SRC=""
          for candidate in bin/lumark bin/Lumark build/bin/lumark build/bin/Lumark; do
            if [ -f "$candidate" ]; then
              SRC="$candidate"
              break
            fi
          done
          if [ -z "$SRC" ]; then
            echo "ERROR: Compiled binary not found in bin/ or build/bin/" >&2
            exit 1
          fi
          echo "Staging binary from ${SRC}..."
          [ "$SRC" != "bin/lumark" ] && cp -pf "$SRC" bin/lumark
          [ "$SRC" != "bin/Lumark" ] && cp -pf "$SRC" bin/Lumark
          [ "$SRC" != "build/bin/lumark" ] && cp -pf "$SRC" build/bin/lumark
          [ "$SRC" != "build/bin/Lumark" ] && cp -pf "$SRC" build/bin/Lumark
          chmod 755 bin/lumark bin/Lumark build/bin/lumark build/bin/Lumark

      - name: Build Debian Package
        run: |
          ./packaging/linux/build-deb.sh "${{ needs.prepare.outputs.version }}"

      - name: Build AppImage
        run: |
          ./packaging/linux/build-appimage.sh "${{ needs.prepare.outputs.version }}"

      - name: Verify AppImage Execution & Entrypoint
        run: |
          APPIMAGE="build/bin/${{ needs.prepare.outputs.linux_appimage }}"
          if [ ! -f "${APPIMAGE}" ]; then
            echo "ERROR: Expected AppImage not found: ${APPIMAGE}" >&2
            exit 1
          fi
          test -x "${APPIMAGE}"
          "${APPIMAGE}" --appimage-extract
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/Lumark
          rm -rf squashfs-root
          echo "Verified AppImage is executable and contains valid AppRun entry point."

      - name: Build Portable Linux Binary Tarball
        run: |
          tar -czf "build/bin/${{ needs.prepare.outputs.linux_tar }}" -C build/bin lumark Lumark

      - name: Build RPM Package (nfpm)
        run: |
          mkdir -p bin
          cp -pf build/bin/lumark bin/lumark
          sed "s/version: .*/version: \"${{ needs.prepare.outputs.version }}\"/" build/linux/nfpm/nfpm.yaml > /tmp/nfpm.yaml
          RPM_NAME="${{ needs.prepare.outputs.linux_rpm }}"
          RPM_BASE="${RPM_NAME%.rpm}"
          GIT_COMMITTER_NAME="Lumark Team" \
          GIT_COMMITTER_EMAIL="team@lumark.local" \
          GOARCH=amd64 \
          wails3 tool package -name "${RPM_BASE}" -format rpm -config /tmp/nfpm.yaml -out build/bin
          if [ -f "build/bin/${RPM_NAME}.rpm" ] && [ ! -f "build/bin/${RPM_NAME}" ]; then
            mv "build/bin/${RPM_NAME}.rpm" "build/bin/${RPM_NAME}"
          fi
          ls -la "build/bin/${RPM_NAME}"

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            build/bin/${{ needs.prepare.outputs.linux_deb }}
            build/bin/${{ needs.prepare.outputs.linux_appimage }}
            build/bin/${{ needs.prepare.outputs.linux_tar }}
            build/bin/${{ needs.prepare.outputs.linux_rpm }}
          if-no-files-found: error

  build-windows:
    name: Build Windows Package (NSIS Installer)
    needs: [prepare]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

      - name: Set up NSIS
        uses: nsis-dev/setup-nsis@v1

      - name: Build Wails App
        run: wails3 build

      - name: Stage Executable
        shell: bash
        run: |
          if [ -f bin/markdown-viewer.exe ] && [ ! -f bin/Lumark.exe ]; then
            cp bin/markdown-viewer.exe bin/Lumark.exe
          fi
          if [ -f bin/Lumark.exe ] && [ ! -f bin/markdown-viewer.exe ]; then
            cp bin/Lumark.exe bin/markdown-viewer.exe
          fi

      # =========================================================================
      # OPTIONAL CODE SIGNING: Windows Executable
      # To enable code signing, configure the required secrets in GitHub:
      # Option 1: Azure Trusted Signing (Recommended for modern cloud signing)
      #   Secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #            AZURE_TRUSTED_SIGNING_ENDPOINT, AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
      #            AZURE_TRUSTED_SIGNING_PROFILE_NAME
      # Option 2: SignPath (Cloud Authenticode Signing)
      #   Secrets: SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID,
      #            SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
      # Option 3: Standard PFX / Authenticode Certificate
      #   Secrets: WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD
      # =========================================================================
      # - name: Sign Windows Executable (Azure Trusted Signing)
      #   if: env.AZURE_CLIENT_SECRET != ''
      #   uses: azure/trusted-signing-action@v0.4.0
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      #     certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE_NAME }}
      #     files: bin/Lumark.exe

      - name: Build NSIS Installer
        shell: bash
        run: |
          mkdir -p bin
          makensis \
            -DPRODUCT_VERSION="${{ needs.prepare.outputs.version }}" \
            -DOUTFILE="../../bin/${{ needs.prepare.outputs.windows_installer }}" \
            packaging/windows/installer.nsi

      # =========================================================================
      # OPTIONAL CODE SIGNING: NSIS Installer Executable
      # =========================================================================
      # - name: Sign NSIS Installer (Azure Trusted Signing)
      #   if: env.AZURE_CLIENT_SECRET != ''
      #   uses: azure/trusted-signing-action@v0.4.0
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      #     certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE_NAME }}
      #     files: bin/${{ needs.prepare.outputs.windows_installer }}

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: bin/${{ needs.prepare.outputs.windows_installer }}
          if-no-files-found: error

  build-macos:
    name: Build macOS Package (Universal DMG & App Bundle)
    needs: [prepare]
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34

      - name: Install go-task and create-dmg
        run: brew install go-task create-dmg

      - name: Package Universal Application Bundle
        run: |
          task darwin:package:universal APP_NAME=Lumark

      - name: Verify Universal Binary Architecture
        run: |
          lipo -archs "bin/Lumark.app/Contents/MacOS/Lumark"

      # =========================================================================
      # OPTIONAL CODE SIGNING & NOTARIZATION: macOS App Bundle
      # To enable macOS codesigning and notarization, configure these secrets:
      #   MACOS_CERTIFICATE_BASE64: Base64-encoded Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD: Password for the .p12 certificate
      #   MACOS_KEYCHAIN_PASSWORD: Temp password for CI keychain
      #   APPLE_ID: Apple Developer account email
      #   APPLE_APP_SPECIFIC_PASSWORD: App-specific password generated on appleid.apple.com
      #   APPLE_TEAM_ID: 10-character Apple Developer Team ID
      # =========================================================================
      # - name: Import Developer ID Certificate
      #   if: env.MACOS_CERTIFICATE_BASE64 != ''
      #   env:
      #     MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      #     MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      #     MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      #   run: |
      #     KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
      #     security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      #     security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
      #     security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      #     echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
      #     security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      #
      # - name: Sign macOS Application Bundle
      #   if: env.MACOS_CERTIFICATE_BASE64 != ''
      #   run: |
      #     codesign --force --deep --options runtime \
      #       --entitlements packaging/macos/entitlements.plist \
      #       --sign "Developer ID Application: Lumark (${{ secrets.APPLE_TEAM_ID }})" \
      #       --timestamp \
      #       "bin/Lumark.app"
      #     codesign --verify --deep --strict --verbose=4 "bin/Lumark.app"

      - name: Build DMG Package
        run: |
          ./packaging/macos/create-dmg.sh bin "Lumark" bin "${{ needs.prepare.outputs.macos_dmg }}"

      # =========================================================================
      # OPTIONAL CODE SIGNING & NOTARIZATION: macOS DMG
      # =========================================================================
      # - name: Sign and Notarize DMG Package
      #   if: env.MACOS_CERTIFICATE_BASE64 != ''
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     codesign --force --sign "Developer ID Application: Lumark (${{ secrets.APPLE_TEAM_ID }})" \
      #       --timestamp "bin/${{ needs.prepare.outputs.macos_dmg }}"
      #     codesign --verify --strict --verbose=4 "bin/${{ needs.prepare.outputs.macos_dmg }}"
      #     xcrun notarytool submit "bin/${{ needs.prepare.outputs.macos_dmg }}" \
      #       --apple-id "$APPLE_ID" \
      #       --team-id "$APPLE_TEAM_ID" \
      #       --password "$APPLE_APP_SPECIFIC_PASSWORD" \
      #       --wait
      #     xcrun stapler staple "bin/${{ needs.prepare.outputs.macos_dmg }}"

      - name: Create Zip of Application Bundle
        run: |
          cd bin
          ditto -c -k --sequesterRsrc --keepParent "Lumark.app" "${{ needs.prepare.outputs.macos_zip }}"

      - name: Upload macOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            bin/${{ needs.prepare.outputs.macos_dmg }}
            bin/${{ needs.prepare.outputs.macos_zip }}
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    needs: [prepare, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA256 Checksums
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS.txt
          shopt -s nullglob
          sha256sum lumark_* lumark-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Release Notes Body
        run: |
          cat << 'EOF' > release-body.md
          ## Highlights

          - **Fast, Offline Markdown Reader:** Clean, distraction-free desktop reading for CommonMark and GitHub Flavored Markdown (tables, task lists, strikethrough, autolinks) with 100% offline local rendering and zero telemetry.
          - **Rich Technical Content:** Syntax-highlighted code blocks with Shiki, offline LaTeX math formula rendering with KaTeX (bundled WOFF2 fonts), and Mermaid diagram visualization.
          - **First-Class Bidirectional (RTL/LTR) Support:** Automatic per-block direction detection (`dir="auto"`) for Persian, Arabic, and Hebrew, with scoped CSS direction precedence and non-prose LTR isolation for code, math, and diagrams.
          - **Deep Desktop Integration:** Local single-instance window coordinator, `.md`/`.markdown` file associations, drag-and-drop file opening, CLI argument forwarding, and multi-document tabs with session restoration.
          - **Reading Experience:** In-document text search with match cycling, interactive Table of Contents (TOC) sidebar, Light/Dark/System themes, zoom controls (50%–300%), and debounced live file watcher.

          ---

          ## Installation Guide

          Download the package for your operating system and architecture:

          | Platform | Architecture | Package Format | Filename | Description |
          | :--- | :--- | :--- | :--- | :--- |
          | **Windows** | x64 (64-bit) | NSIS Installer | `${{ needs.prepare.outputs.windows_installer }}` | Standard installer with file associations |
          | **macOS** | Universal (arm64 + x64) | Disk Image | `${{ needs.prepare.outputs.macos_dmg }}` | Branded DMG with drag-and-drop to Applications |
          | **macOS** | Universal (arm64 + x64) | Zip Archive | `${{ needs.prepare.outputs.macos_zip }}` | Portable zipped application bundle |
          | **Linux** | x86_64 / amd64 | AppImage | `${{ needs.prepare.outputs.linux_appimage }}` | Standalone executable (`chmod +x` & run) |
          | **Linux** | x86_64 / amd64 | Debian / Ubuntu | `${{ needs.prepare.outputs.linux_deb }}` | Debian package (`sudo apt install ./...deb`) |
          | **Linux** | x86_64 / amd64 | RPM (Fedora/RHEL) | `${{ needs.prepare.outputs.linux_rpm }}` | RPM package (`sudo dnf install ./...rpm`) |
          | **Linux** | x86_64 / amd64 | Tarball | `${{ needs.prepare.outputs.linux_tar }}` | Portable standalone binary archive |

          > **Not yet available:** Windows ARM64, Linux ARM64 (planned for future releases).

          ---

          ## Checksum Verification

          Download `SHA256SUMS.txt` into the same directory as your downloaded package and verify its integrity:

          - **Linux:**
            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

          - **macOS:**
            ```bash
            shasum -a 256 <filename>
            ```
            *(compare the resulting hash against the matching line in `SHA256SUMS.txt`)*

          - **Windows (PowerShell):**
            ```powershell
            Get-FileHash <filename> -Algorithm SHA256
            ```
            *(compare the `Hash` value against the matching line in `SHA256SUMS.txt`)*

          ---

          ## Unsigned Builds Notice

          Lumark is an independent open-source project and release binaries are not digitally signed with commercial Microsoft Authenticode or Apple Developer ID certificates yet. Code signing and notarization will be introduced in an upcoming release.

          Depending on your operating system, you may see security prompts during installation:

          - **Windows SmartScreen:**
            - Windows Defender SmartScreen may display: *"Windows protected your PC / Microsoft Defender SmartScreen prevented an unrecognized app from starting"*.
            - Click **More info**, then click **Run anyway** to proceed with installation.

          - **macOS Gatekeeper:**
            - On first launch, macOS may report that Lumark cannot be opened because the developer cannot be verified.
            - In Finder, open the `/Applications` folder, **right-click** (or Control-click) `Lumark.app`, select **Open**, and click **Open** in the confirmation dialog.
            - If macOS shows *"'Lumark' is damaged and can’t be opened. You should move it to the Trash"*, clear the quarantine attribute via Terminal:
              ```bash
              xattr -dr com.apple.quarantine /Applications/Lumark.app
              ```

          ---

          ## Linux Notes

          - **Ubuntu 24.04+ (FUSE 2 Requirement for AppImage):**
            Ubuntu 24.04 and newer distributions default to FUSE 3 without backward-compatible FUSE 2 libraries. If the AppImage does not launch, install the FUSE 2 compatibility library:
            ```bash
            sudo apt install libfuse2t64
            ```
            *(On Ubuntu 22.04 or older, use `sudo apt install libfuse2`)*

          - **Runtime Dependencies (.deb & .rpm):**
            Packages support both modern GTK4 / WebKitGTK 6.0 and GTK3 / WebKit2GTK 4.1 runtime stacks. Package managers will automatically resolve dependencies:
            ```bash
            # Debian / Ubuntu / Linux Mint
            sudo apt install ./${{ needs.prepare.outputs.linux_deb }}

            # Fedora / RHEL / Rocky Linux
            sudo dnf install ./${{ needs.prepare.outputs.linux_rpm }}
            ```

          ---

          **Full Changelog**: See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ needs.prepare.outputs.version }}/CHANGELOG.md) for detailed release notes.
          EOF

      - name: Validate Release Asset Filenames & Completeness
        working-directory: release-assets
        run: |
          echo "=== CI Guard: Validating Asset Filenames & Completeness ==="

          # 1. Fail if any asset name contains uppercase letters (except .AppImage extension and SHA256SUMS.txt)
          for file in *; do
            [ ! -f "$file" ] && continue
            fname="$(basename "$file")"
            if [ "$fname" = "SHA256SUMS.txt" ]; then
              continue
            fi
            name_check="${fname%.AppImage}"
            if [[ "$name_check" =~ [A-Z] ]]; then
              echo "ERROR: Release asset '${fname}' contains forbidden uppercase characters!" >&2
              exit 1
            fi
          done
          echo "✓ All release asset filenames verified lowercase (preserving .AppImage extension)."

          # 2. Fail if the filenames in the release body table don't exist among the built assets
          RELEASE_BODY="${GITHUB_WORKSPACE}/release-body.md"
          if [ ! -f "$RELEASE_BODY" ]; then
            echo "ERROR: release-body.md not found at ${RELEASE_BODY}!" >&2
            exit 1
          fi

          TABLE_FILES=$(awk -F'|' '/^\|/ { val = $5; gsub(/^[[:space:]]+|[[:space:]]+$/, "", val); if (val ~ /^`[^`]+`$/) { gsub(/^`|`$/, "", val); print val } }' "$RELEASE_BODY")
          if [ -z "$TABLE_FILES" ]; then
            echo "ERROR: No asset filenames found in release body table!" >&2
            exit 1
          fi

          COUNT=0
          while IFS= read -r expected_file; do
            [ -z "$expected_file" ] && continue
            if [ ! -f "$expected_file" ]; then
              echo "ERROR: Asset '${expected_file}' declared in release body table does not exist in release-assets!" >&2
              exit 1
            fi
            echo "  ✓ Found matching built asset: ${expected_file}"
            COUNT=$((COUNT + 1))
          done <<< "$TABLE_FILES"

          if [ "$COUNT" -lt 7 ]; then
            echo "ERROR: Expected at least 7 assets in release body table, but only found ${COUNT}!" >&2
            exit 1
          fi
          echo "✓ Verified all ${COUNT} release body table assets exist among built assets."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-body.md
          generate_release_notes: false
          append_body: false
          draft: false
          prerelease: false
